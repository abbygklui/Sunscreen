name: sunscreen_app
description: A friendly app that reminds you to wear and reapply sunscreen.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP & API
  http: ^1.2.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Background tasks
  workmanager: ^0.5.2
  android_alarm_manager_plus: ^4.0.3

  # Local storage
  shared_preferences: ^2.2.2

  # Fonts
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
